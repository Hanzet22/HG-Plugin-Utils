name: Build HG PG

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build plugin and global theme pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build plugin
        run: gradle make --stacktrace

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: hg-pg-plugin
          if-no-files-found: error
          path: plugins/**/build/outputs/*.zip
          retention-days: 14

      - name: Package global Aliucord themes
        run: |
          mkdir -p dist
          zip -j dist/hg-pg-global-themes.zip global-themes/*.json
          unzip -t dist/hg-pg-global-themes.zip

      - name: Upload global theme pack
        uses: actions/upload-artifact@v7
        with:
          name: hg-pg-global-themes
          if-no-files-found: error
          path: dist/hg-pg-global-themes.zip
          retention-days: 30
